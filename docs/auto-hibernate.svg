<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="title desc">
  <title id="title">How auto-hibernate works</title>
  <desc id="desc">Closing the lid, going idle, or suspending manually leads to suspend. On battery it hibernates after two hours. On AC it stays suspended.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/>
    </marker>
    <marker id="arrow-ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="878" height="298" rx="18" fill="#f7f8fa" stroke="#e1e6ec"/>

  <text x="32" y="38" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#7b8794" letter-spacing="1.5">AUTO-HIBERNATE</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#1f2933">
    <rect x="32" y="62" width="190" height="42" rx="10" fill="#ffffff" stroke="#d8dee6"/>
    <text x="127" y="88" text-anchor="middle">Close the lid</text>
    <rect x="32" y="118" width="190" height="42" rx="10" fill="#ffffff" stroke="#d8dee6"/>
    <text x="127" y="144" text-anchor="middle">Leave it idle 10 minutes</text>
    <rect x="32" y="174" width="190" height="42" rx="10" fill="#ffffff" stroke="#d8dee6"/>
    <text x="127" y="200" text-anchor="middle">Suspend manually</text>
  </g>

  <path d="M222 83 H252" fill="none" stroke="#c3cbd5" stroke-width="1.5"/>
  <path d="M222 139 H252" fill="none" stroke="#c3cbd5" stroke-width="1.5"/>
  <path d="M222 195 H252" fill="none" stroke="#c3cbd5" stroke-width="1.5"/>
  <path d="M252 83 V195" fill="none" stroke="#c3cbd5" stroke-width="1.5"/>
  <line x1="252" y1="111" x2="292" y2="111" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect x="300" y="76" width="190" height="70" rx="12" fill="#eef4ff" stroke="#2f6fed"/>
    <text x="395" y="106" text-anchor="middle" font-size="17" font-weight="700" fill="#1f3a8a">Suspend</text>
    <text x="395" y="126" text-anchor="middle" font-size="11" fill="#52606d">RAM stays on. Resume is quick.</text>
  </g>

  <line x1="490" y1="111" x2="552" y2="111" stroke="#7b8794" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="521" y="98" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52606d">2 h</text>
  <text x="521" y="132" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52606d">battery</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect x="560" y="76" width="200" height="70" rx="12" fill="#eafaf1" stroke="#1f9d55"/>
    <text x="660" y="106" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Hibernate</text>
    <text x="660" y="126" text-anchor="middle" font-size="11" fill="#52606d">Uses no power; resumes from disk.</text>
  </g>

  <line x1="395" y1="146" x2="395" y2="196" stroke="#b7791f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-ac)"/>
  <text x="409" y="176" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#b7791f">on AC</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect x="300" y="198" width="190" height="52" rx="12" fill="#fff8e6" stroke="#e0a800"/>
    <text x="395" y="221" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4d00">It stays suspended</text>
    <text x="395" y="239" text-anchor="middle" font-size="12" fill="#7a4d00">while the charger is connected.</text>
  </g>

  <text x="660" y="200" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52606d">To resume, open the lid or press power.</text>
</svg>
