name: checks

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          find modules -type f \( -name '*.sh' -o -perm -u+x \) -print0 |
            xargs -0 -r -n1 bash -n

      - name: ShellCheck
        run: |
          find modules -type f \( -name '*.sh' -o -perm -u+x \) -print0 |
            xargs -0 -r shellcheck -S warning
